name: wechat_flutter
description: A new Flutter project..

publish_to: 'none'

version: 1.0.2+102

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter: #flutter sdk
    sdk: flutter
  flutter_localizations: #本地化
    sdk: flutter
  cupertino_icons: 1.0.8 #IOS风格材料图标
  tencent_cloud_chat_sdk: 8.3.6498 #usado só pelas classes de dados (V2TimMessage etc), sem nuvem Tencent
  archive: 3.6.1 #腾讯云im生成token需要
  shared_preferences: 2.3.3 #持久化存储
  provider: 6.1.2 #状态管理
  get: 4.6.6 #状态管理
  cached_network_image: 3.4.1 #图片缓存，图片显示
  oktoast: 3.4.0 #toast提示框
  webview_flutter: 4.10.0 #web显示
  image_picker: 0.8.6 #选取图库
  extended_text: 14.2.0 #文本扩展显示
  extended_text_field: 16.0.1 #文字表情混入
  extended_text_library: 12.0.1 #extended 支持库
  url_launcher: 6.3.1 #打开系统浏览器
  connectivity_plus: 6.1.0 #网络连接
  connectivity_plus_ohos: #^0.0.3 #鸿蒙专属，单不影响正常版本
    git:
      url: https://github.com/ahyangnb/connectivity_plus_ohos.git
      ref: main  # or specify a branch/tag/commit hash
  photo_view: 0.15.0 #图片显示
  dio: 5.7.0 #网络请求
  open_file: 3.5.10 #打开文件
  package_info_plus: 8.1.1 #获取包信息
  flutter_sound: 9.17.5 #音频处理
  permission_handler: 11.3.1 #权限处理
  audioplayers: 6.1.0 #音频处理
  video_player: 2.9.2 #视频播放
  lpinyin: 2.0.3 #拼音
  azlistview_plus: 3.0.0 #特殊列表滑动
  wechat_assets_picker: 9.4.1 #微信图库
  wechat_camera_picker: 4.3.6 #微信拍摄
  photo_manager: 3.5.0 #wechat_assets_picker的配件
  extended_image: 9.0.7 #扩展图片
  platform: 3.1.0 #平台

  # ===== Adicionado pra integração com o Signal =====
  http: ^1.2.0 #chamadas HTTP pras Edge Functions do Supabase (bridge)
  hive: ^2.2.3 #armazenamento local de mensagens/conversas/contatos
  hive_flutter: ^1.1.0 #integração do Hive com o ciclo de vida do Flutter
  libsignal_protocol_dart: ^0.6.2 #protocolo Signal (E2E) rodando no cliente
  supabase_flutter: ^2.6.0 #transporte das mensagens/bundles criptografados

dependency_overrides:
  js: 0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/git/
    - assets/data/
