buildscript {
    ext.kotlin_version = '1.9.24' // Atualizado (era 1.7.22)

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Atualizado (era 7.2.2) — compatível com Gradle 8.7 e Kotlin 1.9.24
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter() removido: o serviço foi desativado pelo JFrog em 2024,
        // manter essa linha só atrasa o build tentando resolver um servidor
        // que não responde mais.
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
