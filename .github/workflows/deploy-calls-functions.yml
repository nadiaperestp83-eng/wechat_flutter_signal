name: Deploy Supabase Calls Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/agora-token/**'
      - 'supabase/functions/call-push/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do cĆ³digo
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular ao projeto Supabase
        run: supabase link --project-ref qsmswvhfqaeebhxtfqwh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configurar secrets do Agora
        run: |
          supabase secrets set \
            "AGORA_APP_ID=$AGORA_APP_ID" \
            "AGORA_APP_CERTIFICATE=$AGORA_APP_CERTIFICATE" \
            --project-ref qsmswvhfqaeebhxtfqwh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}

      - name: Deploy agora-token
        run: supabase functions deploy agora-token --project-ref qsmswvhfqaeebhxtfqwh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy call-push
        run: supabase functions deploy call-push --project-ref qsmswvhfqaeebhxtfqwh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
