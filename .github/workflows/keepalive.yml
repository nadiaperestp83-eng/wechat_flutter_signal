name: Keep Supabase Awake

# O projeto free do Supabase pausa depois de 7 dias sem nenhuma chamada de
# API. Esse workflow só existe pra gerar uma chamada por dia — bem dentro
# da janela de 7 dias — pra ele nunca pausar sozinho.
on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 min — cobre Render (sleep em 15min) e Supabase (pausa em 7 dias) juntos
  workflow_dispatch: {} # também dá pra disparar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar o Supabase (REST root)
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://qsmswvhfqaeebhxtfqwh.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SIGNAL_SUPABASE_ANON_KEY }}")
          echo "Resposta do Supabase: HTTP $codigo"

      - name: Pingar o Render (/health)
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://signal-bridge-dockerfile.onrender.com/health")
          echo "Resposta do Render: HTTP $codigo"
          # Qualquer resposta (mesmo erro) já conta como atividade — o
          # objetivo é só manter os dois serviços acordados.
