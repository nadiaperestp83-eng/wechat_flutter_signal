name: Build APK

# Roda a cada push na main e também permite disparo manual pela aba Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar JDK 17 (exigido pelo Gradle 8.7 / AGP 8.5.0)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release --no-shrink \
            --dart-define=SIGNAL_SUPABASE_ANON_KEY=${{ secrets.SIGNAL_SUPABASE_ANON_KEY }} \
            --dart-define=SIGNAL_SUPABASE_URL=${{ secrets.SIGNAL_SUPABASE_URL }} \
            --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }} \
            --dart-define=GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}

      - name: Publicar APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
